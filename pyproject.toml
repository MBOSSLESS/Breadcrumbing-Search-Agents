[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "breadcrumbing-search-agents"
version = "0.1.0"
description = "ACH and trace-guided strategy evolution for search-agent safety research"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md", "licenses/*"]
dependencies = [
  "openai==1.99.5",
  "pydantic==2.6.4",
  "qwen-agent==0.0.26",
  "dashscope==1.24.4",
  "python-dotenv>=1,<2",
  "numpy==2.2.6",
  "pandas==2.3.2",
  "requests==2.32.5",
  "PyYAML==6.0.2",
  "json5==0.12.1",
  "tqdm==4.67.1",
]

[project.optional-dependencies]
evo = ["sentence-transformers==5.2.3", "transformers==4.56.1"]
proxy = ["httpx[socks]==0.28.1"]
tokenizer = ["transformers>=4.51,<5"]

[tool.setuptools.packages.find]
include = ["breadcrumbing*"]
